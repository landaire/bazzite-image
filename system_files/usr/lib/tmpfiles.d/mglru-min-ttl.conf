# MGLRU thrashing prevention. If the last second of working set cannot stay
# resident, the kernel OOM-kills instead of reclaiming forever. With the default
# 0 a runaway allocation livelocks the whole desktop (zram swap included) long
# before systemd-oomd or the OOM killer act.
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
